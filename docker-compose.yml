# Sobe o App de Escalas em containers: um para o SQL Server, um para criar o
# banco na primeira vez, e um para o app.
#
# Uso:
#   1. copie .env.docker.example para .env e troque as senhas
#   2. docker compose up -d --build
#   3. abra http://localhost:4450
#
# O "restart: always" faz o app e o banco subirem sozinhos quando a maquina
# liga — sem ninguem precisar logar. E o que substitui a tarefa do Windows.

name: app-de-escalas

services:
  # ---- Banco de dados (SQL Server, edicao Express/gratuita) ----------------
  db:
    # Versao fixa (era 2022-latest): o build fica reproduzivel e a atualizacao
    # do SQL Server vira uma decisao. Ao trocar, so para CU MAIS NOVO — o SQL
    # Server nao abre banco gravado por versao mais nova, entao voltar de CU
    # deixa o volume db-data sem subir. Mesma tag no ci.yml, no
    # docker-compose.teste.yml e em scripts/banco-integracao.js.
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    container_name: escalas-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      # So nesta maquina (SSMS/Azure Data Studio aqui mesmo). Sem o 127.0.0.1
      # a porta do SQL ficava aberta para a rede inteira.
      - "127.0.0.1:1433:1433"
    volumes:
      - db-data:/var/opt/mssql   # os dados do banco sobrevivem a reinicios
    restart: always

  # ---- Cria o banco "SoftwareEscalas" e o login do app, e sai --------------
  db-init:
    # A Microsoft so publica "latest" desta imagem (descontinuada); o digest
    # trava a versao.
    image: mcr.microsoft.com/mssql-tools@sha256:62556500522072535cb3df2bb5965333dded9be47000473e9e0f84118e248642
    container_name: escalas-db-init
    depends_on:
      - db
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      # Login proprio do app, criado pelo init-db.sh (dono so do banco do app).
      APP_DB_USER: "${APP_DB_USER:-escalas_app}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD no .env (senha do login do app no SQL Server; veja .env.docker.example)}"
    volumes:
      - ./docker/init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    restart: "no"

  # ---- Ajusta o dono da pasta de dados e sai -------------------------------
  # O app roda como o usuario "node", sem root (ver Dockerfile). Volumes criados
  # quando o app rodava como root tem arquivos do root que o app nao conseguiria
  # mais gravar; este passo passa a pasta para o "node" antes do app subir. E o
  # unico momento em que algo roda como root, e o container sai em seguida.
  app-permissoes:
    build: .
    image: app-de-escalas-app
    user: "0:0"
    entrypoint: ["chown", "-R", "node:node", "/data"]
    volumes:
      - app-data:/data
    restart: "no"

  # ---- O app (Node/Express) ------------------------------------------------
  app:
    build: .
    image: app-de-escalas-app
    container_name: escalas-app
    depends_on:
      db-init:
        condition: service_completed_successfully   # so sobe apos o banco existir
      app-permissoes:
        condition: service_completed_successfully
    environment:
      PORT: "4450"
      # Sem TZ o container roda em UTC e todo "hoje" do app (escala, banco de
      # horas, desligamento, horario do backup) vira o dia seguinte as 21h.
      TZ: "America/Sao_Paulo"
      DB_HOST: "db"            # nome do servico do banco acima
      DB_PORT: "1433"
      DB_DATABASE: "SoftwareEscalas"
      # O app nunca usa o sa (ver init-db.sh).
      DB_USER: "${APP_DB_USER:-escalas_app}"
      DB_PASSWORD: "${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD no .env (senha do login do app no SQL Server; veja .env.docker.example)}"
      DB_AUTH_TYPE: "sql"
      DB_ENCRYPT: "true"
      DB_TRUST_CERT: "true"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      APP_DE_ESCALAS_DATA_DIR: "/data"
    ports:
      - "4450:4450"
    volumes:
      - app-data:/data         # backups e config do app persistem
    restart: always

volumes:
  db-data:
  app-data:
